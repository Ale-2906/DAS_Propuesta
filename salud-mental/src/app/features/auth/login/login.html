<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="badge">Sistema de Salud Mental</div>
      <h1>Iniciar sesión</h1>
      <p>Accede al módulo principal de la propuesta de solución</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="ejemplo@correo.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-box">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
          />
          <button type="button" class="toggle-btn" (click)="togglePassword()">
            {{ showPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
      </div>

      <div class="helper-box">
        <p><strong>Usuario demo:</strong> admin@gmail.com</p>
        <p><strong>Contraseña:</strong> 123456</p>
      </div>

      <div *ngIf="error" class="message error">
        {{ error }}
      </div>

      <div *ngIf="success" class="message success">
        {{ success }}
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? 'Validando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
