<div class="login-page">
    <div class="login-card">

        <div class="login-header">
            <div class="badge">
                <i class="bi bi-heart-pulse-fill"></i> ConectaMente
            </div>
            <h1>Iniciar sesión</h1>
        </div>

        <form (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="email">
                    <i class="bi bi-envelope-fill"></i> Correo electrónico
                </label>
                <div class="input-icon">
                    <i class="bi bi-person-fill"></i>
                    <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="ejemplo@correo.com" />
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="bi bi-lock-fill"></i> Contraseña
                </label>

                <div class="password-wrapper">
                    <i class="bi bi-shield-lock-fill left-icon"></i>

                    <input id="password" [type]="showPassword ? 'text' : 'password'" name="password"
                        [(ngModel)]="password" placeholder="Ingresa tu contraseña" />

                    <button type="button" class="toggle-btn" (click)="togglePassword()">
                        <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                    </button>
                </div>
            </div>

            <div class="helper-box">
                <p><i class="bi bi-person"></i> <strong>Usuario:</strong> admin@gmail.com</p>
                <p><i class="bi bi-key"></i> <strong>Contraseña:</strong> 123456</p>
            </div>

            <div *ngIf="error" class="message error">
                <i class="bi bi-exclamation-circle"></i> {{ error }}
            </div>

            <div *ngIf="success" class="message success">
                <i class="bi bi-check-circle"></i> {{ success }}
            </div>

            <button type="submit" class="submit-btn" [disabled]="loading">
                <i class="bi bi-box-arrow-in-right"></i>
                {{ loading ? 'Validando...' : 'Ingresar' }}
            </button>

        </form>
    </div>
</div>
